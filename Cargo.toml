[package]
name = "vidpress"
version = "0.1.0"
edition = "2021"

[dependencies]
glideapi = "0.1.1"
glideapi_macros = "0.1.1"
linkme = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
