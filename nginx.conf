# /etc/nginx/sites-available/vidpress
# Copy to /etc/nginx/sites-enabled/ and run: sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: run `sudo certbot --nginx -d yourdomain.com` against this exact
# file. Certbot's --nginx plugin will automatically:
#   - add a `listen 443 ssl;` directive (plus ssl_certificate/ssl_certificate_key
#     pointing at its own /etc/letsencrypt/live/yourdomain.com/ paths) to the
#     server block below,
#   - add the recommended TLS protocol/cipher settings,
#   - add an HTTP -> HTTPS redirect for this server block.
# Do NOT hand-write a `listen 443 ssl` block with placeholder certificate
# paths ahead of running certbot — `nginx -t` fails immediately on a
# certificate file that doesn't exist yet, breaking the plain-HTTP config
# below before certbot ever gets to run. The commented reference block at
# the bottom of this file shows what certbot's edit will look like, and
# what to add HSTS as once you've confirmed HTTPS actually works — add HSTS
# only after that, since it tells browsers to refuse plain HTTP to this host
# for the max-age duration, which is painful to walk back if HTTPS turns out
# to be broken.

server {
    listen 80;
    server_name localhost;  # replace with your domain

    # Don't advertise the nginx version in error pages / the Server header.
    server_tokens off;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # API (Rust backend) — large body for file uploads
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 2048m;
    }

    # Direct API access (for 3rd party integrations)
    location ~ ^/(ingest|analyze|upload|jobs|download|download-url|transcribe|transcriptions|keys|health) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 2048m;
    }
}

# ── Reference: what `certbot --nginx` produces (do not uncomment manually —
# ── let certbot generate the real cert paths; this is here so you know what
# ── to expect, and what to add once HTTPS is confirmed working) ────────────
#
# server {
#     listen 443 ssl;
#     server_name yourdomain.com;
#     server_tokens off;
#
#     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     # Add only after confirming HTTPS works end to end — see note above.
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
#     # ... same location blocks as the :80 server above ...
# }
#
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }
