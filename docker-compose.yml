services:
  theflate-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theflate-api
    restart: unless-stopped
    # x265 asks the kernel for NUMA-aware thread placement via set_mempolicy().
    # Docker's default seccomp profile denies that syscall, so every encode
    # prints a wall of "set_mempolicy: Operation not permitted" before any real
    # output. The encode itself is unaffected - x265 falls back to default
    # allocation, and on a single-socket machine the two are equivalent -
    # SYS_NICE simply lets the call succeed and keeps the logs readable.
    cap_add:
      - SYS_NICE
    ports:
      - "8080:8080"
      # ws::listen binds 8081 inside the same process for live-stream
      # recording. Without this mapping the feature is unreachable from the
      # host and the browser's WebSocket connect simply times out.
      - "8081:8081"
    environment:
      - THEFLATE_STORAGE=/tmp/theflate_output
      - THEFLATE_DB=/var/lib/theflate/theflate.db
      - THEFLATE_CORS_ORIGIN=http://localhost:3000
    volumes:
      - theflate-data:/var/lib/theflate
      - theflate-storage:/tmp/theflate_output

  theflate-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      # These MUST be build args, not runtime environment. next build inlines
      # every NEXT_PUBLIC_* value into the client bundle, so a runtime env var
      # arrives far too late to change where the browser sends its requests.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_BASE_URL: http://localhost:3000
        NEXT_PUBLIC_WS_URL: ws://localhost:8081
    container_name: theflate-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
    depends_on:
      - theflate-api

volumes:
  theflate-data:
  theflate-storage:
